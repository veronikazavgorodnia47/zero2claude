<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <nav>
    <div class="nav-inner">
      <span class="nav-logo">Bookmarks</span>
      <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </nav>

  <main>
    <section class="form-section">
      <h2>Add Bookmark</h2>
      <form id="bookmark-form">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g. GitHub" required />
        </div>
        <div class="form-group">
          <label for="url">URL</label>
          <input type="url" id="url" placeholder="https://example.com" required />
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="Uncategorized">Uncategorized</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Reading">Reading</option>
            <option value="Tools">Tools</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button type="submit">Add Bookmark</button>
      </form>
    </section>

    <section class="list-section">
      <div class="list-header">
        <h2>Saved Bookmarks <span id="count"></span></h2>
        <input type="search" id="search" placeholder="Search by title..." />
      </div>
      <div class="filter-tabs" id="filter-tabs"></div>
      <ul id="bookmark-list"></ul>
      <p id="empty-msg">No bookmarks yet. Add one above.</p>
      <p id="no-results">No bookmarks match your search.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>

</html>
