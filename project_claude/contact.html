<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    textarea {
      padding: 10px 14px;
      border: 1.5px solid #e0e0e5;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fafafa;
      resize: vertical;
      min-height: 130px;
      transition: border-color 0.15s;
      outline: none;
    }

    textarea:focus {
      border-color: #1d1d1f;
      background: #fff;
    }

    input.invalid,
    textarea.invalid {
      border-color: #ff3b30;
      background: #fff8f8;
    }

    .error-msg {
      font-size: 0.8rem;
      color: #ff3b30;
      margin-top: 4px;
      min-height: 16px;
    }

    .success-msg {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      background: #f0fff4;
      border: 1.5px solid #34c759;
      border-radius: 8px;
      color: #1a7a35;
      font-size: 0.9rem;
      font-weight: 500;
    }

    @media (prefers-color-scheme: dark) {
      textarea {
        background: #0e0e10;
        border-color: #2a2a2e;
        color: #f0f0f0;
      }

      textarea:focus {
        border-color: #f0f0f0;
        background: #0e0e10;
      }

      input.invalid,
      textarea.invalid {
        background: #1f0e0e;
        border-color: #ff3b30;
      }

      .success-msg {
        background: #0e1f14;
        border-color: #34c759;
        color: #34c759;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <span class="nav-logo">Contact</span>
    </div>
  </nav>

  <main>
    <section class="form-section">
      <h2>Get in Touch</h2>
      <form id="contact-form" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Jane Smith" />
          <span class="error-msg" id="name-error"></span>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="jane@example.com" />
          <span class="error-msg" id="email-error"></span>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" placeholder="Write your message here..."></textarea>
          <span class="error-msg" id="message-error"></span>
        </div>
        <button type="submit">Send Message</button>
        <div class="success-msg" id="success-msg">Message sent! We'll get back to you soon.</div>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('contact-form');
    const successMsg = document.getElementById('success-msg');

    const fields = {
      name: {
        el: document.getElementById('name'),
        error: document.getElementById('name-error'),
        validate(val) {
          if (!val) return 'Name is required.';
          return '';
        }
      },
      email: {
        el: document.getElementById('email'),
        error: document.getElementById('email-error'),
        validate(val) {
          if (!val) return 'Email is required.';
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) return 'Enter a valid email address.';
          return '';
        }
      },
      message: {
        el: document.getElementById('message'),
        error: document.getElementById('message-error'),
        validate(val) {
          if (!val) return 'Message is required.';
          return '';
        }
      }
    };

    function validateField(field) {
      const val = field.el.value.trim();
      const msg = field.validate(val);
      field.error.textContent = msg;
      field.el.classList.toggle('invalid', !!msg);
      return !msg;
    }

    // Clear error on input once the user starts correcting
    Object.values(fields).forEach(field => {
      field.el.addEventListener('input', () => {
        if (field.el.classList.contains('invalid')) validateField(field);
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const valid = Object.values(fields).map(validateField).every(Boolean);
      if (!valid) return;

      successMsg.style.display = 'block';
      form.reset();
      Object.values(fields).forEach(f => f.el.classList.remove('invalid'));
      setTimeout(() => { successMsg.style.display = 'none'; }, 4000);
    });
  </script>

</body>

</html>
